name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # 현재 devDependencies(@types/node ^20)와 맞춘 Node LTS.
  NODE_VERSION: "20"

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # task:contract·screen:contract가 scripts/*.py를 `python`으로 실행하므로
      # (Ubuntu 러너에는 python3만 있고 python alias가 없을 수 있어) 명시적으로 준비한다.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Task contract
        run: npm run task:contract

      - name: Screen contract (ci mode)
        run: npm run screen:contract -- --mode=ci

      - name: Build
        run: npm run build

  public-smoke:
    name: public-smoke
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Supabase Secret이 없어도 통과해야 하는 공개(비로그인) Smoke만 실행한다.
      # 인증이 필요한 Smoke(tests/e2e/auth-smoke.spec.ts)는 이 Workflow의 필수 Gate에 포함하지 않는다.
      - name: Public E2E smoke (Chromium)
        run: npm run test:e2e:public

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
